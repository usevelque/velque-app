<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>App · Velque</title>
<meta name="description" content="Trade the Velque test market: a continuous book while Nasdaq is open, auctions at one price while it is closed, an opening cross before the bell.">
<meta name="theme-color" content="#F58AAE">
<link rel="icon" type="image/png" sizes="192x192" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta property="og:title" content="App · Velque">
<meta property="og:image" content="/assets/og-image.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app/app.css">
</head>
<body>
<header class="top"><div class="top-in">
  <a class="brand" href="/" aria-label="Velque home"><img src="/assets/logo/velque-lockup-ink.png" alt="Velque"></a>
  <span class="pill-test">Test market</span>
  <div class="mkts" id="mkts" aria-label="Markets"></div>
  <nav><a href="/docs#sessions">How it works</a><a href="/">Site</a></nav>
  <button id="connect" class="btn">Connect wallet</button>
</div></header>

<main class="wrap">
 <div class="col-l">
  <section class="card window" aria-live="polite">
    <div class="sess" id="sess">
      <span data-s="day">Day book</span><span data-s="dark">Night auctions</span><span data-s="cross">Opening cross</span>
    </div>
    <div class="row between">
      <div>
        <div class="k" id="s-kicker">SESSION</div>
        <div class="big" id="s-title">…</div>
      </div>
      <div class="timer">
        <div class="k" id="s-timer-k">CLEARS IN</div>
        <div class="big mono" id="w-timer">--:--</div>
      </div>
    </div>
    <div class="bar"><span id="w-bar"></span></div>
    <div class="stats">
      <div><div class="k">MARKET</div><div class="v" id="w-pair">tNVDAx / tUSDC</div></div>
      <div><div class="k">REFERENCE</div><div class="v" id="w-ref">…</div><div class="hint" id="w-ref-src"></div></div>
      <div><div class="k">LAST PRICE</div><div class="v" id="w-last">…</div></div>
      <div><div class="k" id="s4-k">ORDERS IN WINDOW</div><div class="v" id="s4-v">0</div><div class="hint" id="s4-h"></div></div>
    </div>
    <p class="note" id="w-state"></p>
  </section>

</main>

<footer><div class="foot-in"><span>© <span id="y"></span> Velque</span><nav><a href="/docs">Docs</a><a href="/docs#risk">Risk</a><a href="https://x.com/usevelque" target="_blank" rel="noopener">X</a></nav></div></footer>
<script src="/app/app.js"></script>
</body>
</html>
